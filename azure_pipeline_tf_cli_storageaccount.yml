# ============================================================================  
# Terraform Pipeline for Azure Public Cloud (One-Stage Plan & Apply)  
# ============================================================================
##This pipeline is for the CLI for Storage Account

trigger: none

pool:
  name: ' Mod Infrastructure'
  demands:
    - agent.os -equals linux

variables:
  TF_VERSION: '1.14.2'
  TF_WORKING_DIR: '.'
  TF_VAR_build_userid: "$(Build.RequestedForEmail)"
  TF_VAR_build_url: "$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
  # Dynamic build date for tagging
  TF_BUILD_DATE: "$(Build.BuildId)-$(Date:yyyy-MM-dd_HH-mm-ss)"
  TF_VAR_build_date: "$(TF_BUILD_DATE)"
  TF_TARGET_MODULE: 'module.storage'

stages:
- stage: Terraform
  displayName: 'Terraform Plan & Apply Stage'
  jobs:
  - job: Terraform
    displayName: 'Terraform Plan & Apply'
    steps:

    # --------------------------
    # Inject build metadata into terraform.tfvars (optional)
    # --------------------------
    - bash: |
        TFVARS_PATH="${TF_WORKING_DIR}/terraform.tfvars"
        BUILD_USERID="$BUILD_REQUESTEDFOREMAIL"
        BUILD_URL="${SYSTEM_COLLECTIONURI}${SYSTEM_TEAMPROJECT}/_build/results?buildId=${BUILD_BUILDID}"
        BUILD_DATE="$(date +%Y-%m-%d_%H-%M-%S)"
        echo "BuildUserId: $BUILD_USERID"
        echo "BuildURL: $BUILD_URL"
        echo "BuildDate: $BUILD_DATE"
        if [ -f "$TFVARS_PATH" ]; then
          sed -i "s|REPLACE_BUILD_ID|$BUILD_USERID|g" "$TFVARS_PATH"
          sed -i "s|REPLACE_BUILD_URL|$BUILD_URL|g" "$TFVARS_PATH"
        fi
      displayName: 'Inject Build Metadata into terraform.tfvars'

    # --------------------------
    # Azure Public Cloud login
    # --------------------------
    - bash: |
        az cloud set --name AzureCloud
        az login --identity
        az account show
      displayName: "Azure Login with Managed Identity"

    # --------------------------
    # Install Terraform
    # --------------------------
    - bash: |
        set -e
        curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o terraform.zip
        unzip -o terraform.zip
        mkdir -p "$HOME/.local/bin"
        mv terraform "$HOME/.local/bin/"
        export PATH="$HOME/.local/bin:$PATH"

        terraform -version
      displayName: "Install Terraform"

    # --------------------------
    # Clean Terraform cache
    # --------------------------
    - bash: |
        find "${TF_WORKING_DIR}" -type d -name ".terraform" -exec rm -rf {} + 2>/dev/null || true
        find "${TF_WORKING_DIR}" -type f -name ".terraform.lock.hcl" -exec rm -f {} + 2>/dev/null || true
      displayName: "Clean Terraform Cache"

    # --------------------------
    # Terraform init
    # --------------------------
    - bash: |
        set -e
        cd "${TF_WORKING_DIR}"
        terraform init -upgrade
        terraform providers
      displayName: "Terraform Init"
      env:
        ARM_USE_MSI: true
        ARM_TENANT_ID: $(ARM_TENANT_ID)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

    # --------------------------
    # Terraform Format & Validate
    # --------------------------
    - bash: |
        set -e
        cd "${TF_WORKING_DIR}"
        terraform fmt -recursive -check -diff
        terraform validate
      displayName: "Terraform Format & Validate"
      continueOnError: true

    # --------------------------
    # Terraform Plan & Apply
    # --------------------------
    - bash: |
        set -e
        cd "${TF_WORKING_DIR}"

        PLAN_FILE="tfplan"
        TARGET_FLAGS=""

        if [ -n "${TF_TARGET_MODULE}" ]; then
          for MODULE in ${TF_TARGET_MODULE}; do
            TARGET_FLAGS="${TARGET_FLAGS} -target=${MODULE}"
          done
          PLAN_FILE="tfplan-$(echo ${TF_TARGET_MODULE} | tr ' ' '-' | tr '.' '-')"
          echo "Targeting specific module(s): ${TF_TARGET_MODULE}"
        fi

        echo "Running terraform plan..."
        terraform plan ${TARGET_FLAGS}
        terraform plan -out=${PLAN_FILE} ${TARGET_FLAGS}
        echo "Applying terraform plan..."
        terraform apply -auto-approve ${PLAN_FILE}

      displayName: "Terraform Plan & Apply"
      env:
        TF_VAR_build_userid: "$(TF_VAR_build_userid)"
        TF_VAR_build_url: "$(TF_VAR_build_url)"
        TF_VAR_build_date: "$(TF_BUILD_DATE)"
        ARM_USE_MSI: true
        ARM_TENANT_ID: $(ARM_TENANT_ID)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

# --------------------------
# Enable backup for blobs + PITR (CLI only)
# Reads storage account values from terraform.tfvars
# --------------------------
    - bash: |
        set -e
        TFVARS_PATH="${TF_WORKING_DIR}/terraform.tfvars"
        if [ ! -f "$TFVARS_PATH" ]; then
          echo "terraform.tfvars not found at $TFVARS_PATH"
          exit 1
        fi

        get_tfvar() {
          local key="$1"
          local value
          value=$(grep -E "^[[:space:]]*${key}[[:space:]]*=" "$TFVARS_PATH" \
            | tail -n 1 \
            | sed -E 's/^[^=]*=\s*//; s/"//g; s/\s+$//' \
            | tr -d '\r')
          echo "$value"
        }

        STORAGE_ACCOUNT_NAME=$(get_tfvar sa_name)
        STORAGE_RESOURCE_GROUP=$(get_tfvar rg_name)
        STORAGE_LOCATION=$(get_tfvar location)
        BACKUP_POLICY_NAME=$(get_tfvar backup_policy_name)
        DELETE_RETENTION_DAYS=$(get_tfvar delete_retention_days)
        CONTAINER_DELETE_RETENTION_DAYS=$(get_tfvar container_delete_retention_days)
        RESTORE_DAYS=$(get_tfvar restore_days)

        if [ -z "$STORAGE_ACCOUNT_NAME" ] || [ -z "$STORAGE_RESOURCE_GROUP" ] || [ -z "$STORAGE_LOCATION" ]; then
          echo "Missing sa_name, rg_name, or location in terraform.tfvars"
          exit 1
        fi

        if [ -z "$DELETE_RETENTION_DAYS" ] || [ -z "$CONTAINER_DELETE_RETENTION_DAYS" ] || [ -z "$RESTORE_DAYS" ]; then
          echo "Missing delete_retention_days, container_delete_retention_days, or restore_days in terraform.tfvars"
          exit 1
        fi

        echo "Storage Account: ${STORAGE_ACCOUNT_NAME}"
        echo "Resource Group: ${STORAGE_RESOURCE_GROUP}"

        echo "Enabling backup for blobs (versioning, change feed, soft delete)..."
        az storage account blob-service-properties update 
          --account-name "${STORAGE_ACCOUNT_NAME}" \
          --resource-group "${STORAGE_RESOURCE_GROUP}" \
          --enable-versioning true \
          --enable-change-feed true \
          --enable-delete-retention true \
          --delete-retention-days "${DELETE_RETENTION_DAYS}" \
          --enable-container-delete-retention true \
          --container-delete-retention-days "${CONTAINER_DELETE_RETENTION_DAYS}"

        echo "Enabling point-in-time restore (PITR) for containers..."
        az storage account blob-service-properties update \
          --account-name "${STORAGE_ACCOUNT_NAME}" \
          --resource-group "${STORAGE_RESOURCE_GROUP}" \
          --enable-restore-policy true \
          --restore-days "${RESTORE_DAYS}"

        echo "Backup and PIT Restore configured."
      displayName: "Enable Backup + PITR for Blobs"

# --------------------------
# Enable Azure Backup for Blobs
# --------------------------
    - bash: |
        set -e
        TFVARS_PATH="${TF_WORKING_DIR}/terraform.tfvars"
        if [ ! -f "$TFVARS_PATH" ]; then
          echo "terraform.tfvars not found at $TFVARS_PATH"
          exit 1
        fi

        get_tfvar() {
          local key="$1"
          local value
          value=$(grep -E "^[[:space:]]*${key}[[:space:]]*=" "$TFVARS_PATH" \
            | tail -n 1 \
            | sed -E 's/^[^=]*=\s*//; s/"//g; s/\s+$//' \
            | tr -d '\r')
          echo "$value"
        }

        STORAGE_ACCOUNT_NAME=$(get_tfvar sa_name)
        STORAGE_RESOURCE_GROUP=$(get_tfvar rg_name)
        STORAGE_LOCATION=$(get_tfvar location)
        BACKUP_POLICY_NAME=$(get_tfvar backup_policy_name)
        BACKUP_VAULT_NAME="${STORAGE_ACCOUNT_NAME}-backup-vault"

        if [ -z "$STORAGE_ACCOUNT_NAME" ] || [ -z "$STORAGE_RESOURCE_GROUP" ] || [ -z "$STORAGE_LOCATION" ]; then
          echo "Missing sa_name, rg_name, or location in terraform.tfvars"
          exit 1
        fi

        if [ -z "$BACKUP_POLICY_NAME" ]; then
          echo "Missing backup_policy_name in terraform.tfvars"
          exit 1
        fi

        echo "Creating Backup Vault (if not exists)..."
        if ! az dataprotection backup-vault show \
          --resource-group "${STORAGE_RESOURCE_GROUP}" \
          --name "${BACKUP_VAULT_NAME}" >/dev/null 2>&1; then
          az dataprotection backup-vault create \
            --name "${BACKUP_VAULT_NAME}" \
            --resource-group "${STORAGE_RESOURCE_GROUP}" \
            --location "${STORAGE_LOCATION}" \
            --storage-settings datastore-type=VaultStore type=LocallyRedundant \
            --identity-type SystemAssigned
        else
          echo "Backup vault already exists."
        fi

        echo "Creating Backup Policy (if not exists)..."
        if ! az dataprotection backup-policy show \
          --resource-group "${STORAGE_RESOURCE_GROUP}" \
          --vault-name "${BACKUP_VAULT_NAME}" \
          --name "${BACKUP_POLICY_NAME}" >/dev/null 2>&1; then
          az dataprotection backup-policy get-default-policy \
            --datasource-type Microsoft.Storage/storageAccounts/blobServices \
            > default-blob-backup-policy.json

          az dataprotection backup-policy create \
            --resource-group "${STORAGE_RESOURCE_GROUP}" \
            --vault-name "${BACKUP_VAULT_NAME}" \
            --name "${BACKUP_POLICY_NAME}" \
            --policy @default-blob-backup-policy.json
        else
          echo "Backup policy already exists."
        fi

        echo "Creating Backup Instance (if not exists)..."
        SUBSCRIPTION_ID=$(az account show --query id -o tsv)
        BACKUP_INSTANCE_NAME="${STORAGE_ACCOUNT_NAME}-blob-backup"
        if ! az dataprotection backup-instance show \
          --resource-group "${STORAGE_RESOURCE_GROUP}" \
          --vault-name "${BACKUP_VAULT_NAME}" \
          --name "${BACKUP_INSTANCE_NAME}" >/dev/null 2>&1; then
          az dataprotection backup-instance create \
            --resource-group "${STORAGE_RESOURCE_GROUP}" \
            --vault-name "${BACKUP_VAULT_NAME}" \
            --backup-instance-name "${BACKUP_INSTANCE_NAME}" \
            --datasource-type Microsoft.Storage/storageAccounts/blobServices \
            --datasource-id "/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${STORAGE_RESOURCE_GROUP}/providers/Microsoft.Storage/storageAccounts/${STORAGE_ACCOUNT_NAME}" \
            --policy-name "${BACKUP_POLICY_NAME}"
        else
          echo "Backup instance already exists."
        fi

        echo "Azure Backup configured for blobs."
      displayName: "Enable Azure Backup for Blobs"